name: Reportar un error
description: Describe un fallo reproducible en Salvadiux Host.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de enviar, elimina tokens, contraseñas, direcciones privadas, nombres de jugadores y datos del mundo de cualquier captura o log.
  - type: textarea
    id: summary
    attributes:
      label: ¿Qué ocurrió?
      description: Describe el error y en qué pantalla o comando aparece.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducirlo
      placeholder: 1. Abre… 2. Selecciona… 3. Pulsa…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ¿Qué esperabas que ocurriera?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Sistema operativo, versión de Host y, si aplica, software/versión de Minecraft.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log relevante, sanitizado
      description: Pega solo las líneas necesarias. No adjuntes archivos de data/, mundos ni archivos .env.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Revisión
      options:
        - label: Revisé el issue tracker para evitar duplicados.
          required: true
        - label: Quité secretos y datos privados del servidor.
          required: true
